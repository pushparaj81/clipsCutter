version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: clipscutter-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clipsCutter
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:alpine
    container_name: clipscutter-redis
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  api:
    build: .
    container_name: clipscutter-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/clipsCutter
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      DEBUG: "False"
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://100.70.7.54:3000","http://100.70.7.54:8000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./public/temp:/app/public/temp
      - ./logs:/app/logs

  # Celery Worker
  worker:
    build: .
    container_name: clipscutter-worker
    restart: always
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=5 -Q clips,celery
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/clipsCutter
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./public/temp:/app/public/temp
      - ./logs:/app/logs

  # Celery Beat (Optional - for scheduled tasks)
  beat:
    build: .
    container_name: clipscutter-beat
    restart: always
    command: celery -A workers.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/clipsCutter
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
    depends_on:
      - redis
      - postgres

volumes:
  postgres_data:
